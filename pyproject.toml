[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Hybrid dense + sparse retrieval over ChromaDB with rank fusion"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
hybrid-rag = "hybrid_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
